# Blueprint de Render para el despliegue de demostración de DETECTA (F6).
# Sin secretos: las claves (base de datos, JWT, SMTP) se cargan a mano en el
# panel de Render (ER 3.6.2).
#
# PASO 0 (prueba de concepto, temporal): el servicio web arranca
# scripts/f6-prueba-concepto/servidor.mjs en lugar del backend. Tras el
# informe del paso 0, startCommand y envVars pasan al backend real.
services:
  # API (NestJS). Ohio (J9). Plan gratuito: se duerme tras 15 min sin tráfico.
  - type: web
    name: detecta-api
    runtime: node
    plan: free
    region: ohio
    branch: fase/f6-despliegue
    rootDir: back
    # --include=dev: nest build necesita las dependencias de desarrollo aunque
    # el servicio corra con NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node ../scripts/f6-prueba-concepto/servidor.mjs
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "26"

  # Front (React compilado). El navegador solo habla con este sitio: /api/* se
  # reescribe hacia la API y la cookie SameSite=Strict queda en el mismo sitio
  # (onrender.com está en la Public Suffix List; línea base §5).
  - type: web
    name: detecta-web
    runtime: static
    branch: fase/f6-despliegue
    buildCommand: cd front && npm ci && npm run build
    staticPublishPath: front/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "26"
      - key: VITE_URL_API
        value: /api
    routes:
      # Quita el prefijo /api, igual que el proxy de Vite en desarrollo.
      - type: rewrite
        source: /api/*
        destination: https://detecta-api.onrender.com/*
      # Respaldo de la SPA (react-router).
      - type: rewrite
        source: /*
        destination: /index.html
